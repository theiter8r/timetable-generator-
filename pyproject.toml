[project]
name = "timetable"
version = "0.1.0"
description = "Clash-free college timetable generator using OR-Tools CP-SAT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "ortools>=9.11",
]

[project.scripts]
timetable = "timetable.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
